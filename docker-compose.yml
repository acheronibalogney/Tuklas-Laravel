services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_FACEBOOK_APP_ID: ${VITE_FACEBOOK_APP_ID:-}
        VITE_AUTH_REDIRECT_URI: ${VITE_AUTH_REDIRECT_URI:-}
        VITE_FACEBOOK_GRAPH_API_VERSION: ${VITE_FACEBOOK_GRAPH_API_VERSION:-v26.0}
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: tuklas
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tuklas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tuklas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tuklas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tuklas-postgres:
